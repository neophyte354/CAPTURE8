# XcodeGen spec — run `xcodegen generate` on a Mac to create Photobooth.xcodeproj
name: Photobooth
options:
  bundleIdPrefix: com.example        # TODO: change to your own reverse-DNS prefix
  deploymentTarget:
    iOS: "17.0"
targets:
  Photobooth:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.photobooth
        TARGETED_DEVICE_FAMILY: "2"          # iPad only
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Resources/Info.plist
    info:
      path: Sources/Resources/Info.plist
      properties:
        CFBundleDisplayName: Photobooth
        UILaunchScreen: {}
        UIRequiresFullScreen: true          # disables Split View / Slide Over interrupting the camera
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSCameraUsageDescription: "The photobooth uses the camera to take your photos."
        NSPhotoLibraryAddUsageDescription: "Save photobooth pictures to this iPad's photo library."
        NSLocalNetworkUsageDescription: "Find printers on the local network."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
